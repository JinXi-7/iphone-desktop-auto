name: DialerApp
options:
  bundleIdPrefix: com.dialer
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: zh-Hans

packages:
  Swifter:
    url: https://github.com/httpswift/swifter.git
    from: "1.5.0"

targets:
  DialerApp:
    type: application
    platform: iOS
    sources:
      - path: DialerApp
    dependencies:
      - package: Swifter
    info:
      path: DialerApp/Info.plist
      properties:
        CFBundleDisplayName: 一键拨号助手
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.utilities
        UILSApplicationQueriesSchemes:
          - tel
        UIBackgroundModes:
          - audio
        NSLocalNetworkUsageDescription: 需要局域网权限以接收电脑端的拨号请求
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dialer.DialerApp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
