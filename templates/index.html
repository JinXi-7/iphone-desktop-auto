<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一键拨号 - iPhone Desktop Auto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container py-4">
        <!-- 标题 -->
        <div class="text-center mb-4">
            <h2><i class="bi bi-telephone-fill text-primary"></i> 一键拨号</h2>
            <p class="text-muted mb-0">电脑点击，手机自动拨号</p>
        </div>

        <!-- 连接状态卡片 -->
        <div class="card mb-4" id="status-card">
            <div class="card-header d-flex align-items-center justify-content-between">
                <span><i class="bi bi-broadcast"></i> <span id="status-title">连接状态</span></span>
                <span class="badge bg-secondary" id="status-badge">检测中...</span>
            </div>
            <div class="card-body">
                <div id="status-info">
                    <p class="text-muted mb-0">检测中...</p>
                </div>
                <button class="btn btn-primary btn-sm mt-2 d-none" id="connect-btn" onclick="connectDevice()">
                    <i class="bi bi-arrow-repeat"></i> 重新检测
                </button>
            </div>
        </div>

        <!-- 快速拨号区 -->
        <div class="card mb-4">
            <div class="card-header">
                <i class="bi bi-telephone-outbound"></i> 快速拨号
            </div>
            <div class="card-body">
                <div class="input-group">
                    <input type="text" class="form-control" id="phone-input" placeholder="输入电话号码...">
                    <button class="btn btn-success" onclick="quickDial()">
                        <i class="bi bi-telephone-fill"></i> 拨号
                    </button>
                </div>
                <div class="mt-2" id="dial-result"></div>
            </div>
        </div>

        <!-- 联系人列表 -->
        <div class="card">
            <div class="card-header d-flex align-items-center justify-content-between">
                <span><i class="bi bi-people"></i> 联系人列表</span>
                <div class="d-flex gap-2">
                    <input type="text" class="form-control form-control-sm" id="search-input" placeholder="搜索..." oninput="fetchContacts()" style="width: 150px;">
                    <button class="btn btn-warning btn-sm" onclick="document.getElementById('excel-file').click()" title="从Excel导入">
                        <i class="bi bi-file-earmark-spreadsheet"></i> 导入
                    </button>
                    <input type="file" id="excel-file" accept=".xlsx,.xls" style="display:none" onchange="importExcel()">
                    <button class="btn btn-success btn-sm" onclick="showAddModal()">
                        <i class="bi bi-person-plus-fill"></i> 添加
                    </button>
                </div>
            </div>
            <div class="card-body p-0">
                <div id="contacts-list" class="list-group list-group-flush">
                    <div class="text-center text-muted py-5">
                        <div class="spinner-border spinner-border-sm"></div> 加载中...
                    </div>
                </div>
            </div>
        </div>

        <!-- 拨号历史 -->
        <div class="card mt-4">
            <div class="card-header d-flex align-items-center justify-content-between">
                <span><i class="bi bi-clock-history"></i> 拨号历史</span>
                <button class="btn btn-outline-secondary btn-sm" onclick="fetchHistory()">
                    <i class="bi bi-arrow-clockwise"></i> 刷新
                </button>
            </div>
            <div class="card-body p-0">
                <div id="history-list" class="list-group list-group-flush">
                    <div class="text-center text-muted py-4">
                        <div class="spinner-border spinner-border-sm"></div> 加载中...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加/编辑联系人弹窗 -->
    <div class="modal fade" id="contact-modal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modal-title">添加联系人</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="edit-id">
                    <div class="mb-3">
                        <label class="form-label">姓名 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="contact-name" placeholder="请输入姓名">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">电话号码 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="contact-phone" placeholder="请输入电话号码">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">分组</label>
                        <input type="text" class="form-control" id="contact-group" placeholder="可选，如：家人、同事">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="saveContact()">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 获取 ADB 状态
        async function fetchStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                updateStatusUI(data);
            } catch (e) {
                console.error('状态获取失败:', e);
            }
        }

        // 更新状态 UI
        function updateStatusUI(data) {
            const badge = document.getElementById('status-badge');
            const title = document.getElementById('status-title');
            const info = document.getElementById('status-info');
            const connectBtn = document.getElementById('connect-btn');

            if (data.mode === 'app') {
                title.textContent = '手机 App 连接状态';
                if (data.connected) {
                    badge.className = 'badge bg-success';
                    badge.textContent = '已连接';
                    info.innerHTML = `
                        <p class="mb-1"><strong>App 地址：</strong>${data.app_url}</p>
                        <p class="mb-1"><strong>设备型号：</strong>${data.device}</p>
                        <p class="mb-0 text-success"><i class="bi bi-check-circle-fill"></i> 服务运行中，可正常拨号</p>
                    `;
                    connectBtn.classList.add('d-none');
                } else {
                    badge.className = 'badge bg-warning text-dark';
                    badge.textContent = '未连接';
                    info.innerHTML = `
                        <p class="mb-1"><strong>App 地址：</strong>${data.app_url}</p>
                        <p class="mb-0 text-danger"><i class="bi bi-x-circle-fill"></i> 无法连接，请确认手机 App 已启动</p>
                    `;
                    connectBtn.classList.remove('d-none');
                    connectBtn.innerHTML = '<i class="bi bi-arrow-repeat"></i> 重新检测';
                }
            } else {
                title.textContent = 'ADB 连接状态';
                if (data.connected) {
                    badge.className = 'badge bg-success';
                    badge.textContent = '已连接';
                    info.innerHTML = `
                        <p class="mb-1"><strong>ADB 工具：</strong><span class="text-success"><i class="bi bi-check-circle-fill"></i> 已安装</span></p>
                        <p class="mb-1"><strong>目标设备：</strong>${data.target_device}</p>
                        <p class="mb-0"><strong>已连接设备：</strong></p>
                        <ul class="list-unstyled">${data.devices.map(d => `<li><i class="bi bi-phone"></i> ${d}</li>`).join('')}</ul>
                    `;
                    connectBtn.classList.add('d-none');
                } else {
                    badge.className = 'badge bg-warning text-dark';
                    badge.textContent = '未连接';
                    info.innerHTML = `
                        <p class="mb-1"><strong>ADB 工具：</strong>${data.adb_installed ? '<span class="text-success"><i class="bi bi-check-circle-fill"></i> 已安装</span>' : '<span class="text-danger"><i class="bi bi-x-circle-fill"></i> 未安装</span>'}</p>
                        <p class="mb-0"><strong>目标设备：</strong>${data.target_device}</p>
                    `;
                    connectBtn.classList.remove('d-none');
                    connectBtn.innerHTML = '<i class="bi bi-plug-fill"></i> 连接设备';
                }
            }
        }

        // 连接设备
        async function connectDevice() {
            const btn = document.getElementById('connect-btn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> 连接中...';
            try {
                const res = await fetch('/api/connect', { method: 'POST' });
                const data = await res.json();
                showDialResult(data.success, data.message);
                fetchStatus();
            } catch (e) {
                showDialResult(false, '请求失败: ' + e.message);
            }
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-plug-fill"></i> 连接设备';
        }

        // 快速拨号
        async function quickDial() {
            const phone = document.getElementById('phone-input').value.trim();
            if (!phone) {
                showDialResult(false, '请输入电话号码');
                return;
            }
            try {
                const res = await fetch('/api/dial', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: phone })
                });
                const data = await res.json();
                showDialResult(data.success, data.message);
                fetchHistory();
            } catch (e) {
                showDialResult(false, '请求失败: ' + e.message);
            }
        }

        // 显示结果
        function showDialResult(success, message) {
            const div = document.getElementById('dial-result');
            const cls = success ? 'alert-success' : 'alert-danger';
            const icon = success ? 'bi-check-circle-fill' : 'bi-exclamation-circle-fill';
            div.innerHTML = `<div class="alert ${cls} py-2 mb-0"><i class="bi ${icon}"></i> ${message}</div>`;
            setTimeout(() => { div.innerHTML = ''; }, 5000);
        }

        // ==================== 联系人管理 ====================

        let searchTimer = null;

        // 获取联系人列表
        async function fetchContacts() {
            const search = document.getElementById('search-input').value.trim();
            try {
                const res = await fetch('/api/contacts?search=' + encodeURIComponent(search));
                const contacts = await res.json();
                renderContacts(contacts);
            } catch (e) {
                console.error('获取联系人失败:', e);
            }
        }

        // 渲染联系人列表
        function renderContacts(contacts) {
            const list = document.getElementById('contacts-list');
            if (contacts.length === 0) {
                list.innerHTML = '<div class="text-center text-muted py-5"><i class="bi bi-people display-6"></i><p class="mt-2 mb-0">暂无联系人，点击「添加」创建</p></div>';
                return;
            }
            list.innerHTML = contacts.map(c => `
                <div class="list-group-item d-flex align-items-center justify-content-between">
                    <div class="d-flex align-items-center flex-grow-1" style="cursor: pointer;" onclick="dialContact(${c.id}, '${c.phone}', '${escapeHtml(c.name)}')">
                        <div class="me-3">
                            <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center" style="width: 40px; height: 40px; font-size: 16px;">
                                ${c.name.charAt(0).toUpperCase()}
                            </div>
                        </div>
                        <div>
                            <div class="fw-bold">${escapeHtml(c.name)}</div>
                            <div class="text-muted small">
                                <i class="bi bi-telephone"></i> ${escapeHtml(c.phone)}
                                ${c.group_name ? '<span class="badge bg-info ms-1">' + escapeHtml(c.group_name) + '</span>' : ''}
                                ${c.last_dialed ? '<span class="ms-2"><i class="bi bi-clock"></i> ' + c.last_dialed + '</span>' : ''}
                            </div>
                        </div>
                    </div>
                    <div class="btn-group btn-group-sm">
                        <button class="btn btn-outline-success" onclick="event.stopPropagation(); dialContact(${c.id}, '${c.phone}', '${escapeHtml(c.name)}')" title="拨号">
                            <i class="bi bi-telephone-fill"></i>
                        </button>
                        <button class="btn btn-outline-primary" onclick="event.stopPropagation(); showEditModal(${c.id})" title="编辑">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button class="btn btn-outline-danger" onclick="event.stopPropagation(); deleteContact(${c.id}, '${escapeHtml(c.name)}')" title="删除">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // 拨打联系人电话
        async function dialContact(id, phone, name) {
            try {
                const res = await fetch('/api/dial', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: phone, contact_id: id, name: name || phone })
                });
                const data = await res.json();
                showDialResult(data.success, data.message);
                fetchContacts();
                fetchHistory();
            } catch (e) {
                showDialResult(false, '请求失败: ' + e.message);
            }
        }

        // 显示添加弹窗
        function showAddModal() {
            document.getElementById('modal-title').textContent = '添加联系人';
            document.getElementById('edit-id').value = '';
            document.getElementById('contact-name').value = '';
            document.getElementById('contact-phone').value = '';
            document.getElementById('contact-group').value = '';
            new bootstrap.Modal(document.getElementById('contact-modal')).show();
        }

        // 显示编辑弹窗
        async function showEditModal(id) {
            try {
                const res = await fetch('/api/contacts');
                const contacts = await res.json();
                const c = contacts.find(x => x.id === id);
                if (!c) return;
                document.getElementById('modal-title').textContent = '编辑联系人';
                document.getElementById('edit-id').value = c.id;
                document.getElementById('contact-name').value = c.name;
                document.getElementById('contact-phone').value = c.phone;
                document.getElementById('contact-group').value = c.group_name || '';
                new bootstrap.Modal(document.getElementById('contact-modal')).show();
            } catch (e) {
                console.error('获取联系人详情失败:', e);
            }
        }

        // 保存联系人（添加或更新）
        async function saveContact() {
            const id = document.getElementById('edit-id').value;
            const name = document.getElementById('contact-name').value.trim();
            const phone = document.getElementById('contact-phone').value.trim();
            const group = document.getElementById('contact-group').value.trim();

            if (!name || !phone) {
                alert('请填写姓名和电话号码');
                return;
            }

            const body = JSON.stringify({ name, phone, group_name: group });
            try {
                if (id) {
                    const res = await fetch('/api/contacts/' + id, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: body
                    });
                    const data = await res.json();
                    if (!data.success) { alert(data.message); return; }
                } else {
                    const res = await fetch('/api/contacts', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: body
                    });
                    const data = await res.json();
                    if (!data.success) { alert(data.message); return; }
                }
                bootstrap.Modal.getInstance(document.getElementById('contact-modal')).hide();
                fetchContacts();
            } catch (e) {
                alert('保存失败: ' + e.message);
            }
        }

        // 删除联系人
        async function deleteContact(id, name) {
            if (!confirm('确定删除联系人「' + name + '」？')) return;
            try {
                const res = await fetch('/api/contacts/' + id, { method: 'DELETE' });
                const data = await res.json();
                if (!data.success) { alert(data.message); return; }
                fetchContacts();
            } catch (e) {
                alert('删除失败: ' + e.message);
            }
        }

        // HTML 转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ==================== Excel 导入 ====================

        async function importExcel() {
            const input = document.getElementById('excel-file');
            if (!input.files.length) return;

            const formData = new FormData();
            formData.append('file', input.files[0]);

            showDialResult(true, '正在导入...');

            try {
                const res = await fetch('/api/import', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (data.success) {
                    const r = data.result;
                    showDialResult(true, `导入完成：成功 ${r.success} 条，跳过 ${r.skipped} 条` + (r.errors.length ? `，错误 ${r.errors.length} 条` : ''));
                    fetchContacts();
                } else {
                    showDialResult(false, data.message);
                }
            } catch (e) {
                showDialResult(false, '导入失败: ' + e.message);
            }
            input.value = '';
        }

        // ==================== 拨号历史 ====================

        async function fetchHistory() {
            try {
                const res = await fetch('/api/history');
                const history = await res.json();
                renderHistory(history);
            } catch (e) {
                console.error('获取历史失败:', e);
            }
        }

        function renderHistory(history) {
            const list = document.getElementById('history-list');
            if (history.length === 0) {
                list.innerHTML = '<div class="text-center text-muted py-4"><i class="bi bi-clock-history display-6"></i><p class="mt-2 mb-0">暂无拨号记录</p></div>';
                return;
            }
            list.innerHTML = history.map(h => `
                <div class="list-group-item d-flex align-items-center justify-content-between">
                    <div>
                        <span class="badge ${h.status === 'success' ? 'bg-success' : 'bg-danger'} me-2">${h.status === 'success' ? '成功' : '失败'}</span>
                        <span class="fw-bold">${escapeHtml(h.name)}</span>
                        <span class="text-muted ms-2"><i class="bi bi-telephone"></i> ${escapeHtml(h.phone)}</span>
                    </div>
                    <div class="text-muted small">${h.dialed_at}</div>
                </div>
            `).join('');
        }

        // 页面加载后立即检测状态，之后每 5 秒刷新
        fetchStatus();
        fetchContacts();
        fetchHistory();
        setInterval(fetchStatus, 5000);
    </script>
</body>
</html>
