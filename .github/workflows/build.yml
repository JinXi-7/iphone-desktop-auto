name: 多平台打包

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: 一键拨号-windows
          - os: macos-latest
            artifact_name: 一键拨号-macos
          - os: ubuntu-latest
            artifact_name: 一键拨号-linux

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Linux 系统依赖（GTK）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1

      - name: 安装 Python 依赖
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 打包
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            SEP=";"
            HIDDEN="--hidden-import clr_loader --hidden-import pythonnet --hidden-import webview.platforms.edgechromium --hidden-import webview.platforms.winforms"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            SEP=":"
            HIDDEN="--hidden-import webview.platforms.cocoa --hidden-import webview.platforms.webkit"
          else
            SEP=":"
            HIDDEN="--hidden-import webview.platforms.gtk"
          fi
          pyinstaller --name "一键拨号" --windowed --noconfirm \
            --add-data "templates${SEP}templates" \
            --add-data "static${SEP}static" \
            $HIDDEN \
            --hidden-import requests --hidden-import urllib3 \
            --hidden-import charset_normalizer --hidden-import certifi \
            --hidden-import openpyxl --hidden-import et_xmlfile \
            --hidden-import openpyxl.cell._writer \
            --hidden-import openpyxl.reader.excel \
            --hidden-import openpyxl.workbook._writer \
            main.py

      - name: 复制配置文件
        shell: bash
        run: |
          cp .env.example "dist/一键拨号/" 2>/dev/null || true
          cp contacts_template.xlsx "dist/一键拨号/" 2>/dev/null || true

      - name: 压缩产物
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cd dist && 7z a ../../${{ matrix.artifact_name }}.zip 一键拨号
          elif [ "$RUNNER_OS" = "macOS" ]; then
            cd dist && zip -r ../${{ matrix.artifact_name }}.zip 一键拨号.app
          else
            cd dist && tar czf ../${{ matrix.artifact_name }}.tar.gz 一键拨号
          fi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            *.zip
            *.tar.gz
