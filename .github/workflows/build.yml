name: 多平台打包

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: 一键拨号-windows
          - os: macos-latest
            artifact_name: 一键拨号-macos
          - os: ubuntu-latest
            artifact_name: 一键拨号-linux

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Linux 系统依赖（GTK）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1

      - name: 安装 Python 依赖
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 打包
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            SEP=";"
            HIDDEN="--hidden-import clr_loader --hidden-import pythonnet --hidden-import webview.platforms.edgechromium --hidden-import webview.platforms.winforms"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            SEP=":"
            HIDDEN="--hidden-import webview.platforms.cocoa --hidden-import webview.platforms.webkit"
          else
            SEP=":"
            HIDDEN="--hidden-import webview.platforms.gtk"
          fi
          pyinstaller --name "一键拨号" --windowed --noconfirm \
            --add-data "templates${SEP}templates" \
            --add-data "static${SEP}static" \
            $HIDDEN \
            --hidden-import requests --hidden-import urllib3 \
            --hidden-import charset_normalizer --hidden-import certifi \
            --hidden-import openpyxl --hidden-import et_xmlfile \
            --hidden-import openpyxl.cell._writer \
            --hidden-import openpyxl.reader.excel \
            --hidden-import openpyxl.workbook._writer \
            main.py

      - name: 复制配置文件
        shell: bash
        run: |
          cp .env.example "dist/一键拨号/" 2>/dev/null || true
          cp contacts_template.xlsx "dist/一键拨号/" 2>/dev/null || true

      - name: 压缩产物
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cd dist && 7z a ../../${{ matrix.artifact_name }}.zip 一键拨号
          elif [ "$RUNNER_OS" = "macOS" ]; then
            cd dist && zip -r ../${{ matrix.artifact_name }}.zip 一键拨号.app
          else
            cd dist && tar czf ../${{ matrix.artifact_name }}.tar.gz 一键拨号
          fi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            *.zip
            *.tar.gz

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: 34.0.0

      - name: 授予 Gradlew 执行权限
        run: chmod +x android-app/gradlew

      - name: 编译 Debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: 重命名 APK
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk 一键拨号-android.apk

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: 一键拨号-android
          path: 一键拨号-android.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 项目
        working-directory: ios-app
        run: xcodegen generate

      - name: 解析 SPM 依赖
        working-directory: ios-app
        run: |
          xcodebuild -project DialerApp.xcodeproj \
            -scheme DialerApp \
            -resolvePackageDependencies

      - name: 编译 iOS App
        working-directory: ios-app
        run: |
          xcodebuild -project DialerApp.xcodeproj \
            -scheme DialerApp \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: 压缩 App
        run: |
          # 查找编译产物路径
          APP_PATH=$(find ios-app/build -name "DialerApp.app" -type d | head -1)
          echo "找到 App: $APP_PATH"
          APP_DIR=$(dirname "$APP_PATH")
          cd "$APP_DIR"
          zip -r ../../../../../一键拨号-ios.zip DialerApp.app

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: 一键拨号-ios
          path: 一键拨号-ios.zip
